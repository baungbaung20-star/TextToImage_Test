name: Build Android APK

# Actions tab > "Build Android APK" > Run workflow
on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          unzip -o -q project.zip
          rm project.zip
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools (SDK is preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager = $SDKM"
          [ -n "$SDKM" ] || { echo "sdkmanager not found"; ls -la "$ANDROID_HOME"; exit 1; }
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "build-tools;35.0.0" "platforms;android-34" "platforms;android-35"

      - name: Download Godot and export templates
        run: |
          V=$GODOT_VERSION
          BASE=https://github.com/godotengine/godot-builds/releases/download/${V}-stable
          wget -q $BASE/Godot_v${V}-stable_linux.x86_64.zip -O godot.zip
          wget -q $BASE/Godot_v${V}-stable_export_templates.tpz -O templates.tpz
          unzip -q godot.zip
          sudo mv Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          unzip -q templates.tpz -d tpz
          mv tpz/templates/* ~/.local/share/godot/export_templates/${V}.stable/

      - name: Install Android build template
        run: |
          V=$GODOT_VERSION
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${V}.stable/android_source.zip -d android/build
          echo -n "${V}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Restore cached sd-server binary
        id: sdcache
        uses: actions/cache/restore@v4
        with:
          path: native/arm64-v8a
          key: sdserver-${{ hashFiles('ci/build_sd_server.sh') }}-v1

      - name: Build stable-diffusion.cpp server for Android (arm64)
        if: steps.sdcache.outputs.cache-hit != 'true'
        run: bash ci/build_sd_server.sh

      - name: Save sd-server binary to cache
        if: steps.sdcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/arm64-v8a
          key: sdserver-${{ hashFiles('ci/build_sd_server.sh') }}-v1

      - name: Add plugin and server binary to the template
        run: bash ci/patch_template.sh

      - name: Debug keystore (fixed one, so new APKs install over the old app and keep the model)
        run: cp ci/debug.keystore $HOME/debug.keystore

      - name: Godot editor settings and export preset
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
          cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          export_path="build/OnDeviceTextToImage.apk"

          [preset.0.options]

          gradle_build/use_gradle_build=true
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.example.ondeviceimagegen"
          package/name="OnDevice TextToImage"
          package/signed=true
          permissions/internet=true
          EOF

      - name: Import project
        run: |
          # Android export needs ETC2/ASTC texture import enabled
          grep -q "import_etc2_astc" project.godot || sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          godot --headless --import || true

      - name: Check GDScript for errors
        run: godot --headless --check-only --script res://main.gd

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/OnDeviceTextToImage.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OnDeviceTextToImage-apk
          path: build/OnDeviceTextToImage.apk
          
