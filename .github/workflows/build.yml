name: Build Android APK

# GitHub ရဲ့ Actions tab > "Build Android APK" > Run workflow နှိပ်ရင် APK ထွက်ပါမယ်။
on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          unzip -o -q project.zip
          rm project.zip
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools (SDK is preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager = $SDKM"
          [ -n "$SDKM" ] || { echo "sdkmanager not found"; ls -la "$ANDROID_HOME"; exit 1; }
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "build-tools;35.0.0" "platforms;android-34" "platforms;android-35"

      - name: Download Godot and export templates
        run: |
          V=$GODOT_VERSION
          BASE=https://github.com/godotengine/godot-builds/releases/download/${V}-stable
          wget -q $BASE/Godot_v${V}-stable_linux.x86_64.zip -O godot.zip
          wget -q $BASE/Godot_v${V}-stable_export_templates.tpz -O templates.tpz
          unzip -q godot.zip
          sudo mv Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          unzip -q templates.tpz -d tpz
          mv tpz/templates/* ~/.local/share/godot/export_templates/${V}.stable/

      - name: Install Android build template
        run: |
          V=$GODOT_VERSION
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${V}.stable/android_source.zip -d android/build
          echo -n "${V}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Add the plugin to the template
        run: |
          echo "== template layout =="
          find android/build -maxdepth 3 -not -path '*/.*' | sort | head -80

          # 1) AndroidManifest that holds the <application> element
          MANIFEST=$(grep -rl --include=AndroidManifest.xml "</application>" android/build | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          [ -n "$MANIFEST" ] || { echo "ERROR: no AndroidManifest.xml with </application>"; exit 1; }
          echo "manifest: $MANIFEST"
          MDIR=$(dirname "$MANIFEST")

          # 2) Source root = the folder that contains com/godot/game/GodotApp.*
          APP=$(find android/build -path '*/com/godot/game/GodotApp.*' | head -1)
          if [ -n "$APP" ]; then
            SRCROOT=${APP%/com/godot/game/*}
          elif [ "$(basename "$MDIR")" = "main" ]; then
            SRCROOT="$MDIR/java"
          else
            SRCROOT="$MDIR/src/main/java"
          fi
          echo "source root: $SRCROOT"
          mkdir -p "$SRCROOT/com/example/imagegen"
          cp ImageGenPlugin.kt "$SRCROOT/com/example/imagegen/ImageGenPlugin.kt"

          # 3) Register the plugin in the manifest
          if ! grep -q "OnDeviceImageGen" "$MANIFEST"; then
            sed -i 's#</application>#    <meta-data android:name="org.godotengine.plugin.v2.OnDeviceImageGen" android:value="com.example.imagegen.ImageGenPlugin" />\n        <uses-native-library android:name="libOpenCL.so" android:required="false" />\n    </application>#' "$MANIFEST"
          fi
          grep -n "OnDeviceImageGen" "$MANIFEST"

          # 4) MediaPipe dependency in the app module's gradle file
          echo "== gradle files =="
          find android/build -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/build/build/*'
          GRADLE=$(grep -rlE "com\.android\.application|android\.application" android/build --include=build.gradle --include=build.gradle.kts | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          [ -n "$GRADLE" ] || GRADLE=android/build/build.gradle
          echo "app gradle: $GRADLE"
          grep -qi kotlin "$GRADLE" || echo "WARNING: kotlin plugin not found in $GRADLE"
          if ! grep -q "tasks-vision-image-generator" "$GRADLE"; then
            sed -i '0,/^dependencies[[:space:]]*{/s//dependencies {\n    implementation "com.google.mediapipe:tasks-vision-image-generator:latest.release"/' "$GRADLE"
          fi
          grep -n "tasks-vision-image-generator" "$GRADLE" || { echo "ERROR: dependency not inserted"; head -60 "$GRADLE"; exit 1; }
          echo "patched OK"

      - name: Debug keystore
        run: |
          keytool -genkeypair -v -keystore $HOME/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Godot editor settings and export preset
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
          cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          export_path="build/OnDeviceTextToImage.apk"

          [preset.0.options]

          gradle_build/use_gradle_build=true
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.example.ondeviceimagegen"
          package/name="OnDevice TextToImage"
          package/signed=true
          permissions/internet=true
          EOF

      - name: Import project
        run: |
          # Android export needs ETC2/ASTC texture import enabled
          grep -q "import_etc2_astc" project.godot || sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          cat project.godot
          godot --headless --import || true

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/OnDeviceTextToImage.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OnDeviceTextToImage-apk
          path: build/OnDeviceTextToImage.apk
          
